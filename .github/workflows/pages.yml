name: Deploy BELMARION Site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Custom-domain deployment refresh: 2026-10-02

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: belmarion-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public site only
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install image extraction dependency if missing
        if: hashFiles('assets/introducing-belmarion-poster.jpg') == ''
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Generate cinematic film poster
        if: hashFiles('assets/introducing-belmarion-poster.jpg') == ''
        run: |
          # Opening frame of the approved film: the smiling man's face.
          ffmpeg -hide_banner -loglevel error -y -i assets/introducing-belmarion-web.mp4 -frames:v 1 -q:v 3 assets/introducing-belmarion-poster.jpg
          test -s assets/introducing-belmarion-poster.jpg
      - name: Generate padded Android Chrome shortcut assets (v4)
        run: |
          python -m pip install --quiet Pillow
          python ops/assets/build-android-website-shortcut.py
          python - <<'PY'
          from pathlib import Path
          import json
          root = Path('.')
          old = 'android-adaptive-v3-20261024'
          new = 'android-adaptive-v4-20261024'
          old_manifest = root / f'site-{old}.webmanifest'
          manifest = json.loads(old_manifest.read_text())
          for icon in manifest['icons']:
              icon['src'] = icon['src'].replace(old, new)
          (root / f'site-{new}.webmanifest').write_text(json.dumps(manifest, indent=2) + chr(10))
          for page in root.glob('*.html'):
              contents = page.read_text()
              if old in contents:
                  page.write_text(contents.replace(old, new))
          assert all((root / icon['src'].removeprefix('./')).is_file() for icon in manifest['icons'])
          PY
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
