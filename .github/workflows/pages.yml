name: Deploy BELMARION Site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages activation trigger: 2026-10-01

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: belmarion-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public site only
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
