name: Deploy BELMARION Site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Custom-domain deployment refresh: 2026-10-02

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: belmarion-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public site only
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install image extraction dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Archive Founding Circle presentation video
        env:
          FILM_DOWNLOAD_URL: 'https://media.descriptusercontent.com/v2/proxy/remux?url=https%3A%2F%2Fapi.descript.com%2Fv2%2Fpublished_projects%2F668c7fe8-e7e3-4b2c-aceb-c019bba71c63%2Fhls%3Fexpiration%3D1791924926921%26signature%3D37e013b8abbf10c4891ad7009bd7b8d02534e1b25c87dbe4df5aa5b4113e1567&filename=Original+speaker+film.mp4&mediaCacheBucketName=production-273614-media-cache&expiration=1791921327&signature=55634d18505c72839f25db20dc9dc4d2ecda5086a85059393db69386d47d14af'
        run: |
          set -euo pipefail
          if test ! -s assets/founding-circle-presentation.mp4; then
            curl --fail --location --retry 3 --retry-delay 3 --connect-timeout 30 --max-time 500 \
              --output /tmp/belmarion-founding-source.mp4 "$FILM_DOWNLOAD_URL"
            ffmpeg -hide_banner -loglevel error -y -i /tmp/belmarion-founding-source.mp4 \
              -map 0:v:0 -map 0:a:0 -c:v libx264 -preset veryfast -crf 25 \
              -pix_fmt yuv420p -c:a aac -b:a 128k -movflags +faststart \
              assets/founding-circle-presentation.mp4
            ffmpeg -hide_banner -loglevel error -y -ss 10.5 -i assets/founding-circle-presentation.mp4 \
              -frames:v 1 -q:v 3 assets/founding-circle-presentation-poster.jpg
            test -s assets/founding-circle-presentation.mp4
            test -s assets/founding-circle-presentation-poster.jpg
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/founding-circle-presentation.mp4 assets/founding-circle-presentation-poster.jpg
            git commit -m "Add Founding Circle presentation film and poster"
            git push origin HEAD:main
          fi
      - name: Generate cinematic film poster
        run: |
          # Opening frame of the approved film: the smiling man's face.
          ffmpeg -hide_banner -loglevel error -y -i assets/introducing-belmarion-web.mp4 -frames:v 1 -q:v 3 assets/introducing-belmarion-poster.jpg
          test -s assets/introducing-belmarion-poster.jpg
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
