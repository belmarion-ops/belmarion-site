name: Deploy BELMARION Site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Custom-domain deployment refresh: 2026-10-02

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: belmarion-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public site only
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install image extraction dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Generate cinematic film poster
        run: |
          # Opening frame of the approved film: the smiling man's face.
          ffmpeg -hide_banner -loglevel error -y -i assets/introducing-belmarion-web.mp4 -frames:v 1 -q:v 3 assets/introducing-belmarion-poster.jpg
          test -s assets/introducing-belmarion-poster.jpg
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
